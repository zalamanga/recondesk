name: Verify ReconDesk
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: recondesk_test
          POSTGRES_USER: recondesk_test
          POSTGRES_PASSWORD: ci-isolated-postgres-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U recondesk_test -d recondesk_test"
          --health-interval 3s --health-timeout 3s --health-retries 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Unit and PostgreSQL HTTP integration tests
        working-directory: backend
        env:
          RECON_TEST_DATABASE_URL: jdbc:postgresql://127.0.0.1:5432/recondesk_test
          RECON_TEST_DB_USER: recondesk_test
          RECON_TEST_DB_PASSWORD: ci-isolated-postgres-only
        run: mvn -B -ntp verify
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npm audit --audit-level=high
        working-directory: frontend
  browser:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      RECON_DB_PASSWORD: ci-local-container-database-only
      RECON_DEMO_PASSWORD: ci-synthetic-browser-account-only
      RECON_APP_ORIGIN: http://127.0.0.1:8096
      RECON_BASE_URL: http://127.0.0.1:8096
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Build and start local stack
        run: docker compose up --build -d --wait --wait-timeout 180
      - name: Browser workflow and concurrency checks
        working-directory: frontend
        run: npm run test:e2e
      - name: Container logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 80
      - name: Stop isolated CI stack
        if: always()
        run: docker compose down
