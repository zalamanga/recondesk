services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: recondesk_test
      POSTGRES_USER: recondesk_test
      POSTGRES_PASSWORD: ${RECON_TEST_DB_PASSWORD:?Run scripts/Init.ps1 first}
    ports: ["127.0.0.1:5447:5432"]
    tmpfs: ["/var/lib/postgresql/data"]
    command: ["postgres", "-c", "shared_buffers=32MB", "-c", "max_connections=30"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recondesk_test -d recondesk_test"]
      interval: 2s
      timeout: 3s
      retries: 30
    mem_limit: 256m
    security_opt: ["no-new-privileges:true"]
