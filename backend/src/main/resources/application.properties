spring.application.name=recondesk
server.port=${PORT:8080}
spring.datasource.url=${RECON_DB_URL:jdbc:postgresql://localhost:5446/recondesk}
spring.datasource.username=${RECON_DB_USER:recondesk}
spring.datasource.password=${RECON_DB_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=6
spring.datasource.hikari.minimum-idle=1
spring.servlet.multipart.max-file-size=1MB
spring.servlet.multipart.max-request-size=2200KB
spring.servlet.multipart.file-size-threshold=2MB
spring.jackson.deserialization.accept-float-as-int=false
spring.jackson.mapper.allow-coercion-of-scalars=false
spring.web.error.include-message=never
spring.web.error.include-stacktrace=never
spring.mvc.log-request-details=false
logging.level.org.springframework.web=INFO
logging.level.org.springframework.jdbc=INFO
logging.level.org.springframework.jdbc.core.JdbcTemplate=INFO
logging.level.org.springframework.jdbc.core.StatementCreatorUtils=INFO
logging.level.org.springframework.boot=INFO
server.forward-headers-strategy=none
recon.origin=${RECON_APP_ORIGIN:http://127.0.0.1:8096}
recon.cookie-secure=${RECON_COOKIE_SECURE:false}
recon.demo-password=${RECON_DEMO_PASSWORD:}
